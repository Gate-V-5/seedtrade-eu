name: Validated COMEXT snapshot
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seedtrade-comext-refresh
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Persist the scheduler's last check and last-good snapshot between runs.
      # The cache is a single scheduler ledger, not a second scheduled job.
      - uses: actions/cache/restore@v6
        with:
          path: .cache/comext-refresh
          key: comext-state-${{ github.run_id }}
          restore-keys: comext-state-
      - name: Check month-end or weekly; validate without deploying
        if: github.event_name == 'schedule'
        run: python scripts/refresh_trade_pulse.py --scheduled --apply
      - name: Explicit manual source check; validate without deploying
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/refresh_trade_pulse.py --apply
      - name: Focused validation
        run: |
          python -m unittest discover -s tests -p 'test_stage1_refresh.py' -v
          python -m unittest discover -s tests -p 'test_comext_publication.py' -v
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install existing website dependencies without postinstall publication
        run: npm ci --ignore-scripts
      - name: Stage 1 metric and presentation validation
        run: node --test tests/stage1Metrics.test.mjs tests/tradePulseClarity.test.mjs
      - name: Build validated snapshot through the existing static website pipeline
        run: npm run build
      - name: Publish validated pair through the existing managed Git build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_comext_snapshot.py --expected-base "${{ github.sha }}" --wait-for-managed
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .cache/comext-refresh
          key: comext-state-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: validated-comext-snapshot-${{ github.run_id }}
          path: |
            src/generated/trade_pulse_public.json
            src/generated/public_data_manifest.json
            .cache/comext-refresh/refresh-state.json
            .cache/comext-refresh/source-manifest.json
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: comext-refresh-failure-${{ github.run_id }}
          path: .cache/comext-refresh/refresh-state.json
          include-hidden-files: true
          retention-days: 7
      # Only the validated JSON pair can be committed by the existing repository
      # token. No Hostinger/API/SMTP secret, feature flag or business-data change.
      # The existing managed Git integration builds/publishes the commit. A
      # failed readback restores the previous pair using a non-forcing commit.
